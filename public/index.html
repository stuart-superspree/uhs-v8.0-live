<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find My Way: Southampton General Hospital</title>
<style>
html, body { margin: 0; background: #F0F4F5; }
.loading { box-sizing: border-box; max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; padding: 2rem 1.25rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .625rem; text-align: center; background: #005EB8; color: #FFFFFF; font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; }
.loading p, .loading h1 { margin: 0; }
.loading-hospital { font-size: 1.375rem; font-weight: 800; }
.loading-title { font-size: 3.25rem; font-weight: 900; line-height: 1.05; }
.loading-wait { font-size: 1.4375rem; font-weight: 700; }
.loading-help { display: flex; flex-direction: column; gap: .75rem; width: 100%; max-width: 22rem; margin-top: .75rem; }
.loading-help a, .loading-help button { box-sizing: border-box; display: block; width: 100%; min-height: 54px; padding: .75rem 1rem; border-radius: 1rem; border: 2px solid #FFFFFF; font: inherit; font-size: 1.1875rem; font-weight: 800; text-align: center; text-decoration: none; cursor: pointer; }
.loading-help button { background: #FFFFFF; color: #003087; }
.loading-help a { background: transparent; color: #FFFFFF; }
</style>
<script defer src="sgh-v7_8-app.min.js?v=8.0"></script>
</head>
<body>
<div id="root">
<main class="loading">
<p class="loading-hospital">Southampton General Hospital</p>
<h1 class="loading-title">Find My Way</h1>
<p class="loading-wait" role="status">This takes a moment.</p>
<noscript><p class="loading-wait">This app needs JavaScript. Please turn JavaScript on in your browser settings, or ask at the main reception desk.</p></noscript>
</main>
</div>
<script>
// v8.0 review (L1): if the app has not started after 8 seconds, say so and offer Try again and a link that opens the
// app at the Main Entrance. The app replaces everything inside #root when it starts, so a .loading still there means
// it has not. The link looks for the folder that holds the app (this page may be 404.html at a mistyped address).
(function () {
  setTimeout(function () {
    var box = document.querySelector('#root .loading');
    if (!box) return;
    var wait = box.querySelector('.loading-wait');
    if (wait) wait.textContent = 'This is taking longer than it should. Check your signal, then try again.';
    var help = document.createElement('div');
    help.className = 'loading-help';
    var again = document.createElement('button');
    again.type = 'button';
    again.textContent = 'Try again';
    again.onclick = function () { window.location.reload(); };
    var link = document.createElement('a');
    link.textContent = 'Start from the Main Entrance';
    link.href = '?tag=CC380';
    help.appendChild(again);
    help.appendChild(link);
    box.appendChild(help);
    // Find the folder that holds the app: this folder, then each folder above it.
    var parts = window.location.pathname.split('/');
    parts.pop();
    var tries = [];
    while (parts.length >= 1) { tries.push(parts.join('/') + '/'); parts.pop(); }
    var i = 0;
    (function next() {
      if (i >= tries.length || !window.fetch) return;
      var dir = tries[i++];
      fetch(dir + 'sgh-v7_8-app.min.js', { method: 'HEAD', cache: 'no-store' }).then(function (r) {
        if (r.ok) link.href = dir + '?tag=CC380'; else next();
      }, function () { next(); });
    })();
  }, 8000);
})();
</script>
</body>
</html>
